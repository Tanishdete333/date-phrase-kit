<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Phrase Kit</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 450px;
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 26px;
    }

    p {
      color: #6b7280;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      margin-top: 20px;
      padding: 14px;
      border-radius: 7px;
      background: #f3f4f6;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .container {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>Date Phrase Kit</h1>
    <p>Enter a natural-language date phrase to find its corresponding date.</p>

    <form id="resolveForm">
      <label for="phrase">Date phrase</label>
      <input
        type="text"
        id="phrase"
        placeholder="e.g. End of next week"
        required
      >

      <label for="today">Reference date</label>
      <input
        type="date"
        id="today"
        required
      >

      <button type="submit">Resolve Date</button>
    </form>

    <div id="result" aria-live="polite">Your result will appear here.</div>
  </main>

  <script>
    const phraseInput = document.getElementById("phrase");
    const todayInput = document.getElementById("today");
    const resolveForm = document.getElementById("resolveForm");
    const result = document.getElementById("result");

    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    todayInput.value = `${year}-${month}-${day}`;

    resolveForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const phrase = phraseInput.value.trim();
      const today = todayInput.value;

      result.textContent = "Resolving...";

      try {
        const response = await fetch(
          `/resolve?phrase=${encodeURIComponent(phrase)}&today=${today}`
        );

        const data = await response.json();

        if (!response.ok) {
          result.textContent = data.error || "Something went wrong.";
          return;
        }

        if (data.result === null) {
          result.textContent = "No date: the resolver refused to guess";
          return;
        }

        result.textContent = `Resolved date: ${data.result}`;

      } catch (error) {
        result.textContent = "Unable to connect to the server.";
      }
    });
  </script>

</body>
</html>
